<svg role="img" viewBox="0 0 900 488" xmlns="http://www.w3.org/2000/svg">
<title>Stories leave, entries stay</title>
<desc>Left: a correction that lives as a story in a person's head leaves when they do, and months later a raw hex ships where a token belonged. Right: the same correction written as a structured registry entry stays, and every session reads it before starting, so the drift is caught. Renders in light and dark.</desc>
<style>
.d{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
.b{font-family:'Lora',Georgia,'Times New Roman',serif;}
.m{font-family:'DM Mono','SFMono-Regular',ui-monospace,'Cascadia Mono','Courier New',monospace;}
.frame{fill:#FAFAF5;stroke:#E3DDCF;}
.ink{fill:#1A1A1A;}.soft{fill:#6B6560;}.faint{fill:#8B857C;}.sig{fill:#FF3B30;}
.hair{stroke:#E3DDCF;}.ink-s{stroke:#1A1A1A;}.soft-s{stroke:#6B6560;}
.card{fill:#FFFFFF;stroke:#CFC8BC;}
.panel{fill:#F1EFE6;stroke:#CFC8BC;}
.trap{fill:#FBEDEB;stroke:#F0B0AA;}
.trapcard{fill:#FFFFFF;stroke:#F0B0AA;}
@media (prefers-color-scheme:dark){
.frame{fill:#1A1A1A;stroke:#3A362F;}
.ink{fill:#F3F0E8;}.soft{fill:#A8A399;}.faint{fill:#7E7970;}.sig{fill:#FF5247;}
.hair{stroke:#3A362F;}.ink-s{stroke:#F3F0E8;}.soft-s{stroke:#A8A399;}
.card{fill:#2E2C27;stroke:#494437;}
.panel{fill:#242320;stroke:#494437;}
.trap{fill:#2A1917;stroke:#6E3B36;}
.trapcard{fill:#2E2C27;stroke:#6E3B36;}
}
</style>
<defs>
<marker id="ac1g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="soft" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="frame" x="10" y="10" width="880" height="468" rx="14" stroke-width="1.5"/>
<text class="m soft" x="40" y="50" font-size="11" letter-spacing="2.5">AGENT CORRECTIONS · WHERE A CORRECTION LIVES</text>
<text class="d ink" x="40" y="84" font-size="26" font-weight="700">Stories leave. Entries stay.</text>

<rect class="trap" x="40" y="112" width="380" height="250" rx="12" stroke-width="1.5"/>
<text class="m sig" x="62" y="142" font-size="11" letter-spacing="2">AS A STORY</text>
<rect class="trapcard" x="66" y="158" width="220" height="70" rx="8" stroke-width="1.4"/>
<text class="m soft" x="84" y="184" font-size="10">a caution, in someone's head</text>
<text class="b ink" x="84" y="209" font-size="14.5" font-style="italic">"use the token, not the hex"</text>
<path class="soft-s" d="M292 190 C 336 176, 360 168, 392 158" fill="none" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ac1g)"/>
<text class="m soft" x="330" y="150" text-anchor="middle" font-size="10">the person leaves</text>
<circle class="sig" cx="74" cy="300" r="5"/>
<text class="b ink" x="90" y="304" font-size="14.5" font-style="italic">Months later, a raw hex ships again.</text>
<text class="m faint" x="90" y="332" font-size="10">the knowledge had nowhere to live but a person</text>

<rect class="panel" x="480" y="112" width="380" height="250" rx="12" stroke-width="1.5"/>
<text class="m ink" x="502" y="142" font-size="11" letter-spacing="2">AS AN ENTRY</text>
<rect class="card" x="506" y="158" width="234" height="112" rx="8" stroke-width="1.6"/>
<text class="m ink" x="524" y="182" font-size="12">corrections.yaml</text>
<line class="hair" x1="524" y1="192" x2="722" y2="192" stroke-width="1"/>
<text class="m soft" x="524" y="212" font-size="10">trigger: token system exists</text>
<text class="m soft" x="524" y="230" font-size="10">correction: reference the token</text>
<text class="m soft" x="524" y="250" font-size="10">fired x3 · last: today</text>
<circle class="ink" cx="514" cy="300" r="5"/>
<text class="b ink" x="530" y="304" font-size="14.5" font-style="italic">Caught before it ships.</text>
<text class="m faint" x="530" y="332" font-size="10">the knowledge lives where the next session looks</text>

<line class="hair" x1="40" y1="392" x2="860" y2="392" stroke-width="1"/>
<text class="b ink" x="450" y="430" text-anchor="middle" font-size="17" font-style="italic">Corrections that live as stories leave when people do.</text>
<text class="m faint" x="450" y="456" text-anchor="middle" font-size="10" letter-spacing="1.5">HEYHI · HEYHI.DESIGN</text>
</svg>
