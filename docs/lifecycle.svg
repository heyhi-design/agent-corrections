<svg role="img" viewBox="0 0 900 528" xmlns="http://www.w3.org/2000/svg">
<title>From mistake to rule</title>
<desc>A correction lives in the registry (lower band) as an active entry. When it fires enough, it is promoted up into the formal layer (upper band) as a rule in a style guide, linter, or CI check. The original registry entry stays behind, marked superseded, pointing to where the rule now lives. Renders in light and dark.</desc>
<style>
.d{font-family:'Sora',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
.b{font-family:'Lora',Georgia,'Times New Roman',serif;}
.m{font-family:'DM Mono','SFMono-Regular',ui-monospace,'Cascadia Mono','Courier New',monospace;}
.frame{fill:#FAFAF5;stroke:#E3DDCF;}
.ink{fill:#1A1A1A;}.soft{fill:#6B6560;}.faint{fill:#8B857C;}.sig{fill:#FF3B30;}
.hair{stroke:#E3DDCF;}.ink-s{stroke:#1A1A1A;}.sig-s{stroke:#FF3B30;}.faint-s{stroke:#8B857C;}
.card{fill:#FFFFFF;stroke:#CFC8BC;}
.rulecard{fill:#FFFFFF;stroke:#1A1A1A;}
.panel{fill:#F1EFE6;stroke:#CFC8BC;}
.band{fill:#ECEAE1;stroke:#CFC8BC;}
@media (prefers-color-scheme:dark){
.frame{fill:#1A1A1A;stroke:#3A362F;}
.ink{fill:#F3F0E8;}.soft{fill:#A8A399;}.faint{fill:#7E7970;}.sig{fill:#FF5247;}
.hair{stroke:#3A362F;}.ink-s{stroke:#F3F0E8;}.sig-s{stroke:#FF5247;}.faint-s{stroke:#7E7970;}
.card{fill:#2E2C27;stroke:#494437;}
.rulecard{fill:#2E2C27;stroke:#F3F0E8;}
.panel{fill:#242320;stroke:#494437;}
.band{fill:#201F1C;stroke:#3E3B34;}
}
</style>
<defs>
<marker id="ac2k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ink" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ac2r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="sig" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="ac2g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="faint" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="frame" x="10" y="10" width="880" height="508" rx="14" stroke-width="1.5"/>
<text class="m soft" x="40" y="50" font-size="11" letter-spacing="2.5">AGENT CORRECTIONS · THE LIFECYCLE</text>
<text class="d ink" x="40" y="84" font-size="26" font-weight="700">From mistake to rule</text>

<rect class="panel" x="40" y="108" width="820" height="92" rx="10" stroke-width="1.5"/>
<text class="m soft" x="58" y="134" font-size="11" letter-spacing="2">THE FORMAL LAYER</text>
<text class="m faint" x="58" y="152" font-size="9.5">style guide · linter · CI check</text>
<rect class="rulecard" x="470" y="120" width="290" height="64" rx="8" stroke-width="1.6"/>
<text class="m soft" x="490" y="145" font-size="10" letter-spacing="1">LINT RULE</text>
<text class="d ink" x="490" y="168" font-size="13" font-weight="600">No raw hex where a token matches</text>

<rect class="band" x="40" y="300" width="820" height="118" rx="10" stroke-width="1.5"/>
<text class="m soft" x="58" y="326" font-size="11" letter-spacing="2">THE CORRECTIONS REGISTRY</text>

<circle class="ink" cx="94" cy="360" r="6"/>
<text class="d ink" x="78" y="388" font-size="11" font-weight="600">the mistake</text>
<line class="ink-s" x1="110" y1="360" x2="153" y2="360" stroke-width="1.6" marker-end="url(#ac2k)"/>

<rect class="card" x="158" y="330" width="214" height="60" rx="8" stroke-width="1.6"/>
<text class="m soft" x="180" y="356" font-size="9.5" letter-spacing="0.5">correction · active</text>
<text class="d ink" x="180" y="377" font-size="11.5">use the token, not the hex</text>

<path class="sig-s" d="M368 330 C 406 290, 466 232, 500 188" fill="none" stroke-width="2.4" marker-end="url(#ac2r)"/>
<text class="b sig" x="404" y="252" text-anchor="end" font-size="13" font-style="italic">fired 3×, promoted</text>

<rect class="panel" x="470" y="330" width="214" height="60" rx="8" stroke-width="1.4" opacity="0.75"/>
<text class="m faint" x="492" y="356" font-size="9.5" letter-spacing="0.5">correction · superseded</text>
<text class="d faint" x="492" y="377" font-size="11">kept as history</text>
<path class="faint-s" d="M600 330 L 600 190" fill="none" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ac2g)"/>
<text class="m faint" x="612" y="258" font-size="9">points to the rule</text>

<line class="hair" x1="40" y1="440" x2="860" y2="440" stroke-width="1"/>
<text class="b ink" x="40" y="472" font-size="16.5" font-style="italic">A mistake becomes a correction. A correction that keeps mattering becomes a rule.</text>
<text class="m faint" x="40" y="496" font-size="10" letter-spacing="1.5">HEYHI · HEYHI.DESIGN</text>
</svg>
